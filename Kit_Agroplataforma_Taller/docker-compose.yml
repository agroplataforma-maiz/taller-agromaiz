# Kit del taller · Agroplataforma
# Uso:  cp .env.ejemplo .env  (edita los valores)  y luego:  docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./data:/srv/data
    ports:
      - "127.0.0.1:8086:8000"
    restart: unless-stopped
# HTTPS automático (necesario para GPS y cámara en los teléfonos)
